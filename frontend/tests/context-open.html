<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>右键进入与打开检查</title></head>
<body><div id="app"></div>
<!-- Run npm run dev, then open /tests/context-open.html. Uses a mock Wails transport. -->
<script type="module">
import { setTransport } from '@wailsio/runtime'
import { nextTick } from 'vue'
window.webkit={messageHandlers:{external:{postMessage(){}}}}
const entry=(path,dir=false,link=false)=>({path,name:path.split('/').pop(),dir,link,size:10,modified:0})
const folder=entry('/context/资料 目录',true),file=entry('/context/中文 & report.txt'),denied=entry('/context/denied',true),link=entry('/context/link',false,true)
const nestedFolder=entry(folder.path+'/子目录',true),nestedFile=entry(folder.path+'/子文件 空格.txt')
const listing={'/context':[folder,file,denied,link],[folder.path]:[nestedFolder,nestedFile],[nestedFolder.path]:[]}
const calls=[],opened=[]
let failOpen=false
setTransport({async call(object,method,windowName,request){
 if(object!==0)return
 const name=request.methodName.split('.').pop(),path=request.args[0];calls.push({name,path})
 if(name==='Home')return {home:'/context',locations:[]}
 if(name==='Tasks')return []
 if(name==='List'){if(path===denied.path)throw new Error('没有读取权限');return listing[path]||[]}
 if(name==='OpenFile'){if(failOpen)throw new Error('默认应用无法打开');opened.push(path);return}
 throw new Error('不应调用：'+name)
}})
await import('../src/main.ts')
const state=document.querySelector('#app').__vue_app__._instance.setupState
const assert=(condition,message)=>{if(!condition)throw new Error(message)}
const flush=async()=>{for(let i=0;i<16;i++)await nextTick()}
const row=path=>[...document.querySelectorAll('tbody tr')].find(r=>r.querySelector('input')?.getAttribute('aria-label')==='选择 '+path.split('/').pop())
const menu=()=>document.querySelector('.file-context-menu')
const action=label=>[...menu()?.querySelectorAll('button')||[]].find(b=>b.textContent.trim()===label)
const context=async(path)=>{(path?row(path):document.querySelector('.file-panel')).dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,clientX:innerWidth-4,clientY:innerHeight-4}));await flush()}
const close=async()=>{menu()?.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await flush()}
try{
 await flush();await context(folder.path)
 assert(menu().querySelector('button')===action('进入')&&!action('打开'),'目录菜单首项不是进入')
 assert(document.activeElement===action('进入'),'键盘初始焦点不是进入')
 const rect=menu().getBoundingClientRect()
 assert(rect.left>=0&&rect.top>=0&&rect.right<=innerWidth&&rect.bottom<=innerHeight,'新增菜单超出最小窗口')
 action('进入').click();await flush()
 assert(state.path===folder.path&&!menu()&&state.history.at(-1)===folder.path,'进入未导航、关闭菜单或加入历史')
 state.goHistory(-1);await flush()
 assert(state.path==='/context','右键进入不能后退')
 await context(file.path)
 assert(menu().querySelector('button')===action('打开')&&!action('进入'),'文件菜单首项不是打开')
 const initialCenter=state.centerRevision
 action('打开').click();await flush()
 assert(opened.at(-1)===file.path&&state.path==='/context'&&!menu(),'文件打开路径改变或误导航')
 assert(state.centerRevision===initialCenter&&!state.centerOperation&&!state.tasks.length,'只读打开创建了任务或日志')
 document.querySelector('[aria-label="展开 资料 目录"]').click();await flush()
 await context(nestedFile.path);action('打开').click();await flush()
 assert(opened.at(-1)===nestedFile.path,'展开层级文件不能打开')
 await context(nestedFolder.path);action('进入').click();await flush()
 assert(state.path===nestedFolder.path,'展开层级目录不能进入')
 await state.navigate('/context');await flush()
 state.selected=[folder,file];await flush();await context(file.path)
 assert(state.selected.length===2&&!action('进入')&&!action('打开'),'混合多选显示了单项入口')
 await close();state.selected=[file,nestedFile];await flush();await context(file.path)
 assert(!action('进入')&&!action('打开'),'多文件显示了打开')
 await close();state.selected=[folder,denied];await flush();await context(folder.path)
 assert(!action('进入')&&!action('打开'),'多目录显示了进入')
 await close();await context(file.path)
 assert(state.selected.length===1&&action('打开'),'右键未选项目未切换为单项')
 await close();await context()
 assert(!action('进入')&&!action('打开')&&state.selected.length===0,'空白菜单显示入口或保留选择')
 await close();await context(link.path)
 assert(!menu(),'链接仍可打开右键菜单')
 await context(file.path)
 menu().dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));await flush()
 assert(document.activeElement===action('显示简介'),'菜单方向键回归')
 menu().dispatchEvent(new KeyboardEvent('keydown',{key:'Home',bubbles:true}));await flush()
 assert(document.activeElement===action('打开'),'Home 无法返回首项')
 await close();failOpen=true;await context(file.path);action('打开').click();await flush()
 assert(!menu()&&state.path==='/context'&&document.querySelector('.toast-container').textContent.includes('默认应用无法打开'),'打开失败未提示或改变目录')
 await context(denied.path);action('进入').click();await flush()
 assert(!menu()&&state.path==='/context'&&document.querySelector('.toast-container').textContent.includes('没有读取权限'),'进入失败未提示或丢失原目录')
 state.busy=true;await flush();await context(file.path)
 assert(!menu(),'运行中仍显示右键菜单')
 state.busy=false;failOpen=false;await flush()
 row(file.path).dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await flush()
 assert(opened.at(-1)===file.path,'双击文件打开回归')
 row(folder.path).dispatchEvent(new MouseEvent('dblclick',{bubbles:true}));await flush()
 assert(state.path===folder.path,'双击目录进入回归')
 assert(calls.every(c=>['Home','Tasks','List','OpenFile'].includes(c.name))&&!state.tasks.length,'进入/打开调用了写入接口')
 window.contextOpenResult={passed:true,opened:opened.length}
 document.title='PASS · 右键进入与打开检查'
}catch(error){window.contextOpenResult={passed:false,error:String(error)};document.title='FAIL · '+error.message;console.error(error)}
</script></body></html>

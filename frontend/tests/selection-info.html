<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>多选简介汇总检查</title></head>
<body>
<div id="app"></div>
<!-- Run npm run dev, then open /tests/selection-info.html. No real files are read or changed. -->
<script type="module">
import { setTransport } from '@wailsio/runtime'
import { nextTick } from 'vue'

window.webkit={messageHandlers:{external:{postMessage(){}}}}
const entry=(name,dir=true,size=0)=>({path:'/info/'+name,name,dir,size,modified:0,link:false})
const folders=Array.from({length:5},(_,i)=>entry('目录'+(i+1))),file=entry('file.txt',false,75)
const calls=[],pending=[]
let cancelled=0
setTransport({async call(object,method,windowName,request){
 if(object===10){cancelled++;return}
 if(object!==0)return
 const name=request.methodName.split('.').pop(),[path,eventName]=request.args
 if(name==='Home')return {home:'/info',locations:[]}
 if(name==='List')return [...folders,file]
 if(name==='Tasks')return []
 if(name==='EntryInfo')return entry('current')
 if(name==='CountDirectory'){
  calls.push(path)
  return new Promise((resolve,reject)=>pending.push({path,eventName,resolve,reject}))
 }
 throw new Error('意外的接口：'+name)
}})
await import('../src/main.ts')
const state=document.querySelector('#app').__vue_app__._instance.setupState
const assert=(condition,message)=>{if(!condition)throw new Error(message)}
const flush=async()=>{for(let i=0;i<20;i++)await nextTick()}
const dialog=()=>document.querySelector('.info-dialog')
const metrics=()=>[...dialog().querySelectorAll('.directory-count')]
const context=async entries=>{
 state.selected=entries;await flush()
 const row=[...document.querySelectorAll('tbody tr')].find(row=>row.querySelector('input')?.getAttribute('aria-label')==='选择 '+entries[0].name)
 row.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,clientX:350,clientY:180}));await flush()
 const info=[...document.querySelectorAll('.file-context-menu button')].find(b=>b.textContent==='显示简介')
 assert(info&&!info.disabled,'所选项目右键缺少显示简介')
 info.click();await flush()
}
const close=async()=>{dialog().querySelector('[aria-label="关闭简介"]').click();await new Promise(requestAnimationFrame);await flush()}
const progress=async count=>{window._wails.dispatchWailsEvent({name:pending[0].eventName,data:count});await flush()}
const finish=async count=>{assert(pending.length===1,'目录没有依次统计');pending.shift().resolve(count);await flush()}
const count=i=>({folders:i,files:i*2,bytes:i*100})
try{
 await flush();await context(folders)
 assert(dialog().open&&state.selected.length===5,'多选右键丢失原选择')
 assert(dialog().querySelectorAll('.entry-info').length===1&&dialog().querySelector('h3').textContent==='5 个项目','多选未合并为一份简介')
 assert(dialog().querySelectorAll('dt').length===2&&metrics().length===2,'多选仍展示逐项详情')
 assert(metrics().every(el=>el.textContent.trim()==='点击计算')&&calls.length===0,'简介提前计算或初始提示不正确')
 metrics()[0].querySelector('button').click();await flush()
 assert(pending.length===1&&pending[0].path===folders[0].path,'未从首个目录开始')
 await progress({folders:0,files:1,bytes:50})
 assert(metrics()[0].textContent.includes('50 B'),'当前目录进度未展示')
 await finish(count(1))
 await progress({folders:0,files:1,bytes:25})
 assert(metrics()[0].textContent.includes('125 B'),'进度未加上已完成目录')
 for(let i=2;i<=5;i++)await finish(count(i))
 assert(metrics()[0].textContent.includes('1.5 KB')&&pending.length===0,'五目录大小汇总不正确')
 assert(calls.join(',')===folders.map(e=>e.path).join(','),'统计顺序不正确')
 metrics()[1].querySelector('button').click();await flush()
 for(let i=1;i<=5;i++)await finish(count(i))
 assert(metrics()[1].textContent.includes('文件 30 个'),'五目录文件数量未累加')
 metrics()[0].querySelector('button').click();await flush()
 assert(metrics()[0].textContent.includes('0 B')&&pending[0].path===folders[0].path,'重新计算未从零开始')
 const beforeClose=calls.length,late=pending.shift()
 await close();late.resolve(count(1));await flush()
 assert(cancelled===1&&calls.length===beforeClose,'关闭简介未取消剩余统计')
 await context([folders[1],file])
 metrics()[0].querySelector('button').click();await flush();await finish(count(2))
 assert(metrics()[0].textContent.includes('275 B')&&pending.length===0,'混合选择未累加普通文件大小')
 metrics()[1].querySelector('button').click();await flush();await finish(count(2))
 assert(metrics()[1].textContent.includes('文件 5 个'),'混合选择未累加普通文件数量')
 await close();await context(folders)
 metrics()[0].querySelector('button').click();await flush();pending.shift().reject(new Error('没有读取权限'));await flush()
 assert(dialog().querySelector('[role=alert]').textContent.includes(folders[0].path)&&dialog().textContent.includes('计算未完成')&&pending.length===0,'失败未标记为未完成或错误后仍继续统计')
 await close();await context([folders[0]])
 assert(dialog().querySelector('h3').textContent===folders[0].name&&dialog().textContent.includes('修改日期')&&metrics().length===2,'单目录简介详情回归')
 await close();await context([file])
 assert(dialog().textContent.includes('75 B')&&metrics().length===0,'单文件简介回归')
 await close()
 window.selectionInfoResult={passed:true,calls:calls.length,cancelled}
 document.title='PASS · 多选简介汇总检查'
}catch(error){
 window.selectionInfoResult={passed:false,error:String(error)}
 document.title='FAIL · '+error.message
 console.error(error)
}
</script>
</body>
</html>

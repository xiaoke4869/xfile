name: Desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test -race ./...
      - if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - if: runner.os == 'Windows'
        run: wails3 package GOOS=windows
      - if: runner.os == 'macOS'
        run: wails3 task darwin:package:dmg
      - uses: actions/upload-artifact@v4
        with:
          name: XFile-${{ runner.os }}
          path: |
            bin/*.dmg
            bin/*installer.exe
          if-no-files-found: error
